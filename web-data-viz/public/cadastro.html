<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Reset</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <header class="corpo_header">
        <h1>
            <div class="secao_img_logo">
                <div class="logo">
                    <img src="./assets/imgs/fase_lava_magmadon.jpeg" alt="logo">
                </div>
                Reset
            </div>
        </h1>
        <nav class="navegacaoSite">
            <a href="./index.html" class="botoes_header">Home</a>
            <a href="#sobre-projeto" class="botoes_header">Sobre o Projeto</a>
            <a href="#justificativa" class="botoes_header">Justificativa</a>
            <a href="#curiosidades" class="botoes_header">Curiosidades</a>
            <a href="./" class="botoes_header">Login</a>
            <a href="./cadastro.html" class="botoes_header">Cadastro</a>
        </nav>

    </header>
    <section class="corpo_cadastro" id="cadastro">
        <div class="sobreamento_lateral"> </div>

        <div class="campo_de_dados">
          <h1>Faça seu cadastro</h1>

          <div class="campo_de_inputs">
            <img src="./assets/icon/nome.svg" class="svg_campos">
            <input type="text" placeholder="Digite seu nome completo" id="ipt_nome">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/calendário.svg" class="svg_campos">
            <input type="date" id="ipt_data_nasc">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/email.svg" class="svg_campos">
            <input type="email" placeholder="Digite seu e-mail" id="ipt_email">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos">
            <input type="password" placeholder="Digite sua senha" id="ipt_senha">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos">
            <input type="password" placeholder="Confirme sua senha" id="ipt_confimar_senha">
          </div>

          <button class="botoes_cadastro_login" >Cadastrar</button>
        </div>
    </section>
</body>
</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
