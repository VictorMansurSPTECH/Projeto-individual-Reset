<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Reset</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>

    <section class="corpo_cadastro" id="cadastro">
        <div class="sobreamento_lateral"> </div>

        <div class="campo_de_dados">

          <h1>Faça seu cadastro</h1>

          <div class="campo_de_inputs">
            <img src="./assets/icon/nome.svg" class="svg_campos" draggable="false">
            <input type="text" placeholder="Digite seu nome completo" id="ipt_nome" oninput="validarNome()">
          </div>
          <p class="p_validaçao" id="p_nome"></p>

          <div class="campo_de_inputs">
            <img src="./assets/icon/calendário.svg" class="svg_campos" draggable="false">
            <input type="date" id="ipt_data_nasc" min="1910-01-01" max="2026-12-31" onchange="validarData()">
          </div>
          <p class="p_validaçao" id="p_data_nasc"></p>

          <div class="campo_de_inputs">
            <img src="./assets/icon/email.svg" class="svg_campos" draggable="false">
            <input type="email" placeholder="Digite seu e-mail" id="ipt_email" oninput="validarEmail()">
          </div>
          <p class="p_validaçao" id="p_email"></p>

          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos" draggable="false">
            <input type="password" placeholder="Digite sua senha" id="ipt_senha" oninput="validarSenha()">
          </div>
          <p class="p_validaçao" id="p_senha"></p>
          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos" draggable="false">
            <input type="password" placeholder="Confirme sua senha" id="ipt_confirmar_senha" oninput="validarConfirmarSenha()">
          </div>
          <p class="p_validaçao" id="p_confirmar_senha"></p>
          <div id="div_erro" role="status" aria-live="polite"></div>
          <button class="botoes_cadastro_login" type="button" onclick="cadastrar()">Cadastrar</button>
        </div>
    </section>
</body>
</html>

<script>

  function validarNome() {
    let nome = ipt_nome.value;

    if (nome.length >= 3 && nome.includes(" ")) {
      p_nome.style.color = "green";
      p_nome.innerHTML = "";
      return true;
    } else {
      p_nome.style.color = "red";
      p_nome.innerHTML = "Digite seu nome completo (mínimo de 3 caracteres).";
      return false;
    }
  }

  function validarData() {
    let data = ipt_data_nasc.value;

    if (data != "" && data >= "1910-01-01" && data <= "2026-12-31") {
      p_data_nasc.style.color = "green";
      p_data_nasc.innerHTML = "";
      return true;
    } else {
      p_data_nasc.style.color = "red";
      p_data_nasc.innerHTML = "A data de nascimento não pode ser inferior a 1910 ou superior a 2026.";
      return false;
    }
  }

  function validarEmail() {
    let email = ipt_email.value;

    if (email.includes("@") && email.includes(".")
      && (email.endsWith("@gmail.com") || email.endsWith("@hotmail.com") || email.endsWith("@outlook.com"))) {
      p_email.style.color = "green";
      p_email.innerHTML = "";
      return true;
    } else {
      p_email.style.color = "red";
      p_email.innerHTML = "O e-mail deve conter '@' e um domínio válido.";
      return false;
    }
  }

  function validarSenha() {
    let senha = ipt_senha.value;
    let caracteresEspeciais = /[!@#$%^&*(),.?":{}|<>]/;
    let caracteresNumericos = /[0-9]/;
    let caracteresLetras = /[a-zA-Z]/;
    let temCaractereEspecial = false;
    let temNumero = false;
    let temLetra = false;

    for (let i = 0; i < senha.length; i++) {
      if (caracteresEspeciais.test(senha[i])) {
        temCaractereEspecial = true;
      }
      if (caracteresNumericos.test(senha[i])) {
        temNumero = true;
      }
      if (caracteresLetras.test(senha[i])) {
        temLetra = true;
      }
    }

    if (senha.length >= 8 && temCaractereEspecial && temNumero && temLetra) {
      p_senha.style.color = "green";
      p_senha.innerHTML = "";
      if (ipt_confirmar_senha.value != "") {
        validarConfirmarSenha();
      }
      return true;
    } else {
      p_senha.style.color = "red";
      p_senha.innerHTML = "A senha deve ter pelo menos 8 caracteres, incluindo letras maiusculas e minusculas, números e caracteres especiais.";
      if (ipt_confirmar_senha.value != "") {
        validarConfirmarSenha();
      }
      return false;
    }
  }

  function validarConfirmarSenha() {
    let senha = ipt_senha.value;
    let confirmarSenha = ipt_confirmar_senha.value;

    if (confirmarSenha != "" && senha == confirmarSenha) {
      p_confirmar_senha.style.color = "green";
      p_confirmar_senha.innerHTML = "";
      return true;
    } else {
      p_confirmar_senha.style.color = "red";
      p_confirmar_senha.innerHTML = "As senhas não coincidem.";
      return false;
    }
  }

  function cadastrar() {
    let listaUsuarios = [];
    let nomeVar = ipt_nome.value;
    let emailVar = ipt_email.value;
    let senhaVar = ipt_senha.value;
    let idadeVar = ipt_data_nasc.value;

    let nomeValido = validarNome();
    let dataValida = validarData();
    let emailValido = validarEmail();
    let senhaValida = validarSenha();
    let confirmacaoValida = validarConfirmarSenha();

    if (!nomeValido || !dataValida || !emailValido || !senhaValida || !confirmacaoValida) {
      div_erro.style.color = "red";
      div_erro.innerHTML = "Verifique os campos destacados antes de continuar.";
      return false;
    }     

    // Se passou por todas as validações locais, adiciona o novo usuário temporariamente na lista
    listaUsuarios.push({
        nome: nomeVar,
        email: emailVar,
        senha: senhaVar,
        idade: idadeVar
    });

    div_erro.innerHTML = "";

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idadeServer: idadeVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          // cardErro.style.display = "block";

          div_erro.style.color = "Green";
          div_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando para tela de Login...<br>";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);

      });

    return false;
  }

  // Listando empresas cadastradas 


</script>
