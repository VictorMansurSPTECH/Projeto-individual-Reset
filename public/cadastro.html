<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Reset</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <header class="corpo_header">
        <h1>
            <div class="secao_img_logo">
                <div class="logo">
                    <img src="./assets/imgs/fase_lava_magmadon.jpeg" alt="logo">
                </div>
                Reset
            </div>
        </h1>
        <nav class="navegacaoSite">
            <a href="./index.html" class="botoes_header">Home</a>
            <a href="#sobre-projeto" class="botoes_header">Sobre o Projeto</a>
            <a href="#justificativa" class="botoes_header">Justificativa</a>
            <a href="./curiosidades.html" class="botoes_header">Curiosidades</a>
            <a href="./login.html" class="botoes_header">Login</a>
            <a href="./cadastro.html" class="botoes_header">Cadastro</a>
        </nav>

    </header>
    <section class="corpo_cadastro" id="cadastro">
        <div class="sobreamento_lateral"> </div>

        <div class="campo_de_dados">
          <h1>Faça seu cadastro</h1>

          <div class="campo_de_inputs">
            <img src="./assets/icon/nome.svg" class="svg_campos" draggable="false">
            <input type="text" placeholder="Digite seu nome completo" id="ipt_nome">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/calendário.svg" class="svg_campos" draggable="false">
            <input type="date" id="ipt_data_nasc">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/email.svg" class="svg_campos" draggable="false">
            <input type="email" placeholder="Digite seu e-mail" id="ipt_email">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos" draggable="false">
            <input type="password" placeholder="Digite sua senha" id="ipt_senha">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos" draggable="false">
            <input type="password" placeholder="Confirme sua senha" id="ipt_confimar_senha">
          </div>

          <button class="botoes_cadastro_login" onclick="cadastrar()">Cadastrar</button>

          <div id="div_erro" ></div>

        </div>
    </section>
</body>
</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 




  function cadastrar() {
    let listaUsuarios = [];
    let caracteresEspeciais = /[!@#$%^&*(),.?":{}|<>]/;
    let caracteresNumericos = /[0-9]/;
    let caracteresLetras = /[a-zA-Z]/;


    let nomeVar = document.getElementById("ipt_nome").value.trim();
    let emailVar = document.getElementById("ipt_email").value.trim();
    let senhaVar = document.getElementById("ipt_senha").value.trim();
    let idadeVar = document.getElementById("ipt_data_nasc").value.trim();
    let ConfirmarSenhaVar = document.getElementById("ipt_confimar_senha").value.trim();
    
    
    if (nomeVar == "" || emailVar == "" || senhaVar == "" || idadeVar == "" || ConfirmarSenhaVar == "") {
      div_erro.style.color = "red";
      div_erro.innerHTML = "Todos os campos devem ser preenchidos!<br>";
      return false;
    }
    if (senhaVar.length < 8) {
        div_erro.style.color = "red";
        div_erro.innerHTML += "A senha precisa ter pelo menos 8 caracteres.<br>";
        return false;
    }

    if (senhaVar !== ConfirmarSenhaVar) {
        div_erro.style.color = "red";
        div_erro.innerHTML += "As senhas não coincidem! <br>";
        return false;
    }

    if(!caracteresEspeciais.test(senhaVar)){
            div_erro.style.color = "red";
            div_erro.innerHTML += "A senha deve conter pelo menos um caractere especial!<br>";
            return false;
    }
    if(!caracteresNumericos.test(senhaVar)){
            div_erro.style.color = "red";
            div_erro.innerHTML += "A senha deve conter pelo menos um número!<br>";
            return false;
    }
    if(!caracteresLetras.test(senhaVar)){
            div_erro.style.color = "red";
            div_erro.innerHTML += "A senha deve conter pelo menos uma letra maiúscula ou minúscula!<br>";
            return false;
    }
    

    if(idadeVar > "2026-01-01" || idadeVar < "1910-01-01") {
        div_erro.style.color = "red";
        div_erro.innerHTML += "Data de nascimento inválida! Por favor, insira uma data entre 1910 e 2026.<br>";
        return false;

    }

    if (!emailVar.includes("@") || !emailVar.includes(".")) {
        div_erro.style.color = "red";
        div_erro.innerHTML += "E-mail inválido! está faltando '@' ou '.'<br>";
        return false;
    }
    if(!emailVar.includes("gmail.com") && !emailVar.includes("hotmail.com") && !emailVar.includes("outlook.com")) {
        div_erro.style.color = "red";
        div_erro.innerHTML += " Está faltando um domínio válido (gmail.com, hotmail.com, outlook.com).<br>";
        return false;
      }



    // Se passou por todas as validações locais, adiciona o novo usuário temporariamente na lista
    listaUsuarios.push({
        nome: nomeVar,
        email: emailVar,
        senha: senhaVar,
        idade: idadeVar
    });

    div_erro.innerHTML = "";


    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idadeServer: idadeVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          // cardErro.style.display = "block";
          if (resposta.ok){
            div_erro.style.color = "Green";
            div_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando para tela de Login...<br>";
            setTimeout(() => {
              window.location = "login.html";
            }, "2000");

          }else if(resposta.status === 404){
            div_erro.style.color = "red";
            div_erro.innerHTML = "Página não encontrada!<br>";

          }else if(resposta.status === 500){
            div_erro.style.color = "red";
            div_erro.innerHTML = "Erro interno do servidor!<br>";
          }else if(resposta.status === 403){
            div_erro.style.color = "red";
            div_erro.innerHTML = "Acesso negado!<br>";

          }else if(resposta.status ===409){
            div_erro.style.color = "red";
            div_erro.innerHTML = "E-mail já cadastrado!<br>";

          }


        } 
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);

      });

    return false;
  }

  // Listando empresas cadastradas 


</script>
