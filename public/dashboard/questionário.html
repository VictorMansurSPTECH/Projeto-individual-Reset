<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Reset</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="icon" href="./assets/icon/favicon.ico">
</head>
<body>

    <header class="corpo_header">
        <h1>
            <div class="secao_img_logo">
                <div class="logo">
                    <img src="./assets/imgs/fase_lava_magmadon.jpeg" alt="logo">
                </div>
                Reset
            </div>
        </h1>
        <nav class="navegacaoSite">
            <a href="./dashboard.html" class="botoes_header">voltar a Dashboard</a>
        </nav>
    </header>

    <!-- Conteúdo Principal / Formulário de Feedback -->
    <main class="container-principal">
        <div class="card-formulario">
            <h2>Avaliação de Experiência e Universo Reset</h2>
            <p>Compartilhe conosco sua experiência geral, os titãs que você mais gostou e a fase que mais marcou você!</p>

            <form id="formFeedback" onsubmit="enviarFeedback(event)">

                <!-- Avaliação de Experiência Geral -->
                <div class="campo">
                    <label for="experiencia">Como você avalia sua experiência geral com o projeto?</label>
                    <select id="experiencia" required>
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="Excelente">Excelente - Nostalgia pura!</option>
                        <option value="Boa">Boa - Muito divertido e interativo</option>
                        <option value="Regular">Regular - Pode melhorar</option>
                        <option value="Ruim">Precisa de ajustes</option>
                    </select>
                </div>

                <!-- Titãs que o usuário mais gostou -->
                <div class="campo">
                    <label>Quais titãs você mais gostou?</label>
                    <div class="opcoes-grid">
                        <label><input type="checkbox" name="titan" value="Goar"> Goar</label>
                        <label><input type="checkbox" name="titan" value="Magmadon"> Magmadon</label>
                        <label><input type="checkbox" name="titan" value="Stench"> Stench</label>
                        <label><input type="checkbox" name="titan" value="Snipe"> Snipe</label>
                        <label><input type="checkbox" name="titan" value="Spilo"> Spilo</label>
                        <label><input type="checkbox" name="titan" value="Es-Electric"> Es-Electric</label>
                        <label><input type="checkbox" name="titan" value="Shelophante"> Shelophante</label>
                        <label><input type="checkbox" name="titan" value="Scorporilla"> Scorporilla</label>
                        <label><input type="checkbox" name="titan" value="Sludge"> Sludge</label>
                        <label><input type="checkbox" name="titan" value="Rattler"> Rattler</label>
                        <label><input type="checkbox" name="titan" value="Rhinoroller"> Rhinoroller</label>
                        <label><input type="checkbox" name="titan" value="Yukitopus"> Yukitopus</label>
                        <label><input type="checkbox" name="titan" value="Uka Uka"> Uka Uka</label>
                        <label><input type="checkbox" name="titan" value="Arachnina"> Arachnina</label>
                    </div>
                </div>

                <!-- Fase / Ambientação Favorita -->
                <div class="campo">
                    <label for="faseFavorita">Qual fase ou ambientação dos mundos você mais gostou?</label>
                    <select id="faseFavorita" required>
                        <option value="" disabled selected>Escolha um mundo/ambientação</option>
                        <option value="Wumpa Island">Wumpa Island (Selva, Cavernas e Templo)</option>
                        <option value="Lumber Yard">Lumber Yard (Serraria Industrial e Cânion)</option>
                        <option value="N. Sanity Island">N. Sanity Island (Praia e Fábrica de Armas)</option>
                        <option value="Uka Tree">Uka Tree (Interior da Árvore Gigante)</option>
                        <option value="Cortex's Lair / Doominator">Cortex's Lair / Doominator (Fase Final)</option>
                    </select>
                </div>

                <!-- O Porquê da Fase Favorita -->
                <div class="campo">
                    <label for="porQueFase">Por que você escolheu essa fase/ambientação?</label>
                    <textarea id="porQueFase" rows="3" placeholder="Explique o que tornou essa ambientação especial (trilha, visual, desafios)..." required></textarea>
                </div>

                <!-- Comentários Adicionais -->
                <div class="campo">
                    <label for="comentario">Comentários ou sugestões adicionais sobre o projeto:</label>
                    <textarea id="comentario" rows="3" placeholder="Deixe sua opinião geral ou sugestão de melhoria..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Avaliação</button>
            </form>

            <div id="mensagemAlerta" class="alerta"></div>
        </div>
    </main>

    <!-- JavaScript do questionário -->
    <script>
        // Função chamada quando o formulário é enviado (pelo onsubmit)
        function enviarFeedback(event) {

            // Impede que a página recarregue ao enviar o formulário
            event.preventDefault();

            // Lê o valor de cada campo da tela
            var experiencia = document.getElementById("experiencia").value;
            var faseFavorita = document.getElementById("faseFavorita").value;
            var porQueFase = document.getElementById("porQueFase").value;
            var comentario = document.getElementById("comentario").value;

            // O id do usuário foi guardado no sessionStorage no login
            var idUsuario = Number(sessionStorage.ID_USUARIO);

            // Pega todos os checkboxes de titãs que estão marcados
            var checkboxes = document.querySelectorAll('input[name="titan"]:checked');

            // Cria uma lista com o valor de cada checkbox marcado
            var titansSelecionados = [];
            for (var i = 0; i < checkboxes.length; i++) {
                titansSelecionados.push(checkboxes[i].value);
            }

            // Validação simples no navegador: o id precisa ser um número maior que zero.
            // (O servidor valida tudo de novo.)
            if (isNaN(idUsuario) || idUsuario <= 0) {
                exibirAlerta("Faça login novamente para enviar sua avaliação.", "erro");
                return;
            }

            // Pelo menos um titã precisa estar marcado
            if (titansSelecionados.length === 0) {
                exibirAlerta("Por favor, selecione pelo menos um titã que você mais gostou.", "erro");
                return;
            }

            // Monta o pacote de dados que será enviado ao servidor
            var dadosQuestionario = {
                idUsuario: idUsuario,
                experiencia: experiencia,
                titans: titansSelecionados,
                faseFavorita: faseFavorita,
                porQueFase: porQueFase,
                comentario: comentario
            };

            // Guarda se a resposta do servidor foi de sucesso (status 200-299)
            var respostaOk = false;

            // Envia os dados para a rota POST /questionario
            fetch("/questionario", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                // Transforma o objeto em texto JSON para viajar pela internet
                body: JSON.stringify(dadosQuestionario)
            })
            .then(function (resposta) {
                // Guarda se deu certo e lê o corpo da resposta
                respostaOk = resposta.ok;
                return resposta.json();
            })
            .then(function (resultado) {
                // Se o servidor respondeu com erro, mostra a mensagem dele
                if (!respostaOk) {
                    exibirAlerta(resultado.erro || "Não foi possível enviar sua avaliação.", "erro");
                    return;
                }

                // Deu certo: mostra mensagem de sucesso e limpa o formulário
                exibirAlerta("Avaliação enviada com sucesso! Obrigado por detalhar sua experiência no Proyecto Reset.", "sucesso");
                document.getElementById("formFeedback").reset();
            })
            .catch(function (erro) {
                // Cai aqui se a internet falhar ou a resposta não for um JSON válido
                console.error("Erro ao enviar questionário:", erro);
                exibirAlerta("Não foi possível enviar sua avaliação. Tente novamente.", "erro");
            });
        }

        // Mostra uma mensagem na tela e a esconde depois de 5 segundos
        function exibirAlerta(mensagem, tipo) {
            var alertaDiv = document.getElementById("mensagemAlerta");
            alertaDiv.textContent = mensagem;
            alertaDiv.className = "alerta " + tipo;
            alertaDiv.style.display = "block";

            setTimeout(function () {
                alertaDiv.style.display = "none";
            }, 5000);
        }
    </script>
</body>
</html>
