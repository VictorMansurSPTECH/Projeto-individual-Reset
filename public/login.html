<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Reset</title>
    <link rel="stylesheet" href="./css/estilo.css">
    <script src="./js/sessao.js"></script>
</head>
<body>
    <header class="corpo_header">
        <h1>
            <div class="secao_img_logo">
                <div class="logo">
                    <img src="./assets/imgs/fase_lava_magmadon.jpeg" alt="logo">
                </div>
                Reset
            </div>
        </h1>
        <nav class="navegacaoSite">
            <a href="./index.html" class="botoes_header">Home</a>
            <a href="#sobre-projeto" class="botoes_header">Sobre o Projeto</a>
            <a href="#justificativa" class="botoes_header">Justificativa</a>
            <a href="./curiosidades.html" class="botoes_header">Curiosidades</a>
            <a href="./login.html" class="botoes_header">Login</a>
            <a href="./cadastro.html" class="botoes_header">Cadastro</a>
        </nav>

    </header>
    <section class="corpo_cadastro" id="cadastro">
        <div class="sobreamento_lateral"> </div>

        <div class="campo_de_dados">

            <div class="img_login">
                
            </div>

          <h1>Faça seu Login</h1>
          <div class="campo_de_inputs">
            <img src="./assets/icon/email.svg" class="svg_campos" draggable="false">
            <input type="email" placeholder="Digite seu e-mail" id="ipt_email" oninput="validarEmail()">
          </div>
          <p class="p_validaçao" id="p_email"></p>

          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos" draggable="false">
            <input type="password" placeholder="Digite sua senha" id="ipt_senha" oninput="validarSenha()">
          </div>
          <p class="p_validaçao" id="p_senha"></p>
          <button class="botoes_cadastro_login" onclick="entrar()">Login</button>
          <div id="div_erro" role="status" aria-live="polite"></div>
          <div id="div_aguardar" style="display: none;">Validando...</div>

        </div>
    </section>
</body>
</html>

<script>

    function validarEmail() {
        let email = ipt_email.value.trim();
        let emailValido = email.includes("@")
            && email.includes(".")
            && (email.endsWith("@gmail.com")
                || email.endsWith("@hotmail.com")
                || email.endsWith("@outlook.com"));

        if (emailValido) {
            p_email.style.color = "green";
            p_email.innerHTML = "";
            return true;
        } else {
            p_email.style.color = "red";
            p_email.innerHTML = email == ""
                ? "Digite seu e-mail."
                : "O e-mail deve conter '@' e um domínio válido.";
            return false;
        }
    }

    function validarSenha() {
        let senha = ipt_senha.value;

        if (senha.trim() != "") {
            p_senha.style.color = "green";
            p_senha.innerHTML = "";
            return true;
        } else {
            p_senha.style.color = "red";
            p_senha.innerHTML = "Digite sua senha.";
            return false;
        }
    }

    function entrar() {
        let emailValido = validarEmail();
        let senhaValida = validarSenha();

        if (!emailValido || !senhaValida) {
            div_erro.style.color = "red";
            div_erro.innerHTML = "Verifique os campos destacados antes de continuar.";
            return false;
        }

        let emailVar = ipt_email.value.trim();
        let senhaVar = ipt_senha.value;
        div_erro.innerHTML = "";
        aguardar();

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                return resposta.json().then(json => {
                    finalizarAguardar();
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    div_erro.style.color = "green";
                    div_erro.innerHTML = "Login realizado com sucesso! Redirecionando...";

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000);
                });
            } else {
                return resposta.text().then(function (texto) {
                    finalizarAguardar();
                    div_erro.style.color = "red";
                    div_erro.innerHTML = resposta.status == 404
                        ? "Usuário não encontrado."
                        : texto || "Não foi possível realizar o login.";
                });
            }
        }).catch(function (erro) {
            finalizarAguardar();
            div_erro.style.color = "red";
            div_erro.innerHTML = "Não foi possível conectar ao servidor. Tente novamente.";
            console.error("Erro ao tentar realizar o login:", erro);
        });

        return false;
    }

</script>
