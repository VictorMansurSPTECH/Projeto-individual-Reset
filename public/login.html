<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Reset</title>
    <link rel="stylesheet" href="./css/estilo.css">
    <script src="./js/sessao.js"></script>
</head>
<body>
    <header class="corpo_header">
        <h1>
            <div class="secao_img_logo">
                <div class="logo">
                    <img src="./assets/imgs/fase_lava_magmadon.jpeg" alt="logo">
                </div>
                Reset
            </div>
        </h1>
        <nav class="navegacaoSite">
            <a href="./index.html" class="botoes_header">Home</a>
            <a href="#sobre-projeto" class="botoes_header">Sobre o Projeto</a>
            <a href="#justificativa" class="botoes_header">Justificativa</a>
            <a href="./curiosidades.html" class="botoes_header">Curiosidades</a>
            <a href="./login.html" class="botoes_header">Login</a>
            <a href="./cadastro.html" class="botoes_header">Cadastro</a>
        </nav>

    </header>
    <section class="corpo_cadastro" id="cadastro">
        <div class="sobreamento_lateral"> </div>

        <div class="campo_de_dados">

            <div class="img_login">
                
            </div>

          <h1>Faça seu Login</h1>
          <div class="campo_de_inputs">
            <img src="./assets/icon/email.svg" class="svg_campos" draggable="false">
            <input type="email" placeholder="Digite seu e-mail" id="ipt_email">
          </div>

          <div class="campo_de_inputs">
            <img src="./assets/icon/cadeado.svg" class="svg_campos" draggable="false">
            <input type="password" placeholder="Digite sua senha" id="ipt_senha">
          </div>
          <button class="botoes_cadastro_login" onclick="entrar()">Login</button>
          <div id="cardErro" style="display: none;">
            <span id="mensagem_erro"></span>
          </div>
          
          <div id="div_aguardar" style="display: none;">Carregando...</div>
          <div id="div_erros_login" style="display: none;"></div>

        </div>
    </section>
</body>
</html>

<script>


    function entrar() {
        // MODIFICAR AQUI: estes nomes precisam apontar para os dois inputs acima.

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            // MODIFICAR AQUI: cardErro e mensagem_erro precisam existir no HTML,
            // ou devem ser substituídos pelos IDs dos elementos de mensagem de erro.
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        // MODIFICAR AQUI: confirme se esta é a rota correta da sua API.
        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    cardErro.style.display = "block"
                    mensagem_erro.innerHTML = "Login realizado com sucesso! Redirecionando...";
                    
                    setTimeout(function () {
                        // MODIFICAR AQUI: altere o destino se o dashboard estiver em outra página.
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
